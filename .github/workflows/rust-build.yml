name: Rust build (laurelia + moe)

on:
  push:
    branches: [dataset, main, master]
    paths:
      - 'rust/**'
  pull_request:
    paths:
      - 'rust/**'
  workflow_dispatch:

jobs:
  build-linux:
    name: cargo build (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ github.sha }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: cargo check (lib)
        run: cargo check --lib
      - name: cargo build --release
        run: cargo build --release --lib --bin laurelia_chat --bin moe_chat
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-linux-bin
          path: rust/target/release/laurelia_chat
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: cargo build (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release
        run: cargo build --release --lib --bin laurelia_chat --bin moe_chat
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: rust-windows-exe
          path: |
            rust/target/release/laurelia_chat.exe
            rust/target/release/moe_chat.exe
          if-no-files-found: warn
          retention-days: 7
