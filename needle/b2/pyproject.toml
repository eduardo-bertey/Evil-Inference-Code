[project]
name = "cactus-needle"
version = "2.0.0"
description = "A 14MB foundation tool-calling model for tiny devices: inference, LoRA finetuning, and build."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "huggingface_hub",
    "numpy",
    "jax",
    "jaxlib",
    "flax>=0.12.8",
    "optax",
    "sentencepiece",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]
test = ["pytest", "pydantic"]

[project.scripts]
needle = "needle.cli:main"

[tool.setuptools.packages.find]
include = ["needle*"]

[tool.setuptools.package-data]
"needle.model" = ["*.model", "*.vocab"]
"needle.playground" = ["index.html", "app.js", "style.css"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end JAX build/finetune tests (init a tiny model)"]
